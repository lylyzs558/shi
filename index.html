<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载 aaa.txt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #222831;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .download-btn {
            padding: 16px 40px;
            font-size: 22px;
            border: none;
            border-radius: 10px;
            background-color: #3992ff;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .download-btn:hover {
            background-color: #2078e9;
        }
    </style>
</head>
<body>
    <!-- a标签直接下载，href写aaa.txt -->
    <a href="aaa.txt" download="aaa.txt">
        <button class="download-btn">立即下载</button>
    </a>
</body>
</html>
